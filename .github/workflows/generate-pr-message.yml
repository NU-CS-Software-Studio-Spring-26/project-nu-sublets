name: Generate PR Message

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

env:
  PR_MESSAGE_MODEL: gpt-4.1-nano
  PR_CONTEXT_MAX_BYTES: "18000"

jobs:
  generate:
    name: Generate concise PR message with OpenAI
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Load PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json number,title,body,baseRefName,headRefName,url > pr.json

      - name: Build PR context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CONTEXT_MAX_BYTES: ${{ env.PR_CONTEXT_MAX_BYTES }}
        run: |
          set -euo pipefail

          mkdir -p tmp/pr-message

          base_ref="$(ruby -rjson -e 'puts JSON.parse(File.read("pr.json")).fetch("baseRefName")')"
          pr_title="$(ruby -rjson -e 'puts JSON.parse(File.read("pr.json")).fetch("title")')"
          pr_url="$(ruby -rjson -e 'puts JSON.parse(File.read("pr.json")).fetch("url")')"

          git fetch origin "$base_ref" --depth=100
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git diff --unified=2 "$base_sha".."$head_sha" > tmp/pr-message/full-diff.patch

          {
            echo "# Pull request"
            echo
            echo "Number: $PR_NUMBER"
            echo "Title: $pr_title"
            echo "URL: $pr_url"
            echo "Base: $base_ref"
            echo "Head SHA: $head_sha"
            echo
            echo "# Commits"
            git log --oneline "$base_sha".."$head_sha"
            echo
            echo "# Changed files"
            git diff --name-status "$base_sha".."$head_sha"
            echo
            echo "# Diff stat"
            git diff --stat "$base_sha".."$head_sha"
            echo
            echo "# Diff excerpt"
            head -c "$PR_CONTEXT_MAX_BYTES" tmp/pr-message/full-diff.patch
          } > tmp/pr-message/context.md

      - name: Build model prompt
        run: |
          set -euo pipefail

          cat > tmp/pr-message/prompt.txt <<'EOF'
          Draft a concise PR message from this context.

          Required format:

          ## Summary

          1-2 sentences explaining the user-visible or engineering purpose.

          ## Changes

          - 3-5 bullets max.
          - Group related edits; do not list every file.

          ## Testing

          - List test/check commands only if they are explicitly present in commits, workflow context, or changed files.
          - If none are evident, write: Not run by generator.

          Constraints:
          - Markdown only.
          - No preamble.
          - No marketing language.
          - No more than 180 words.
          - Do not invent tests, files, features, risks, or implementation details.

          PR context:
          EOF

          cat tmp/pr-message/context.md >> tmp/pr-message/prompt.txt

      - name: Generate PR message with OpenAI
        id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_MESSAGE_MODEL: ${{ env.PR_MESSAGE_MODEL }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping PR message generation."
            exit 0
          fi

          ruby <<'RUBY'
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          prompt = File.read("tmp/pr-message/prompt.txt")
          uri = URI("https://api.openai.com/v1/responses")
          max_attempts = 3

          write_generated_output = lambda do |value|
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |file|
              file.puts("generated=#{value}")
            end
          end

          TransientOpenAIError = Class.new(StandardError)

          request = Net::HTTP::Post.new(uri)
          request["Authorization"] = "Bearer #{ENV.fetch("OPENAI_API_KEY")}"
          request["Content-Type"] = "application/json"
          request.body = JSON.generate(
            model: ENV.fetch("PR_MESSAGE_MODEL"),
            instructions: "You write concise, factual pull request messages for a Rails project. Return markdown only.",
            input: prompt,
            max_output_tokens: 500,
            temperature: 0.2
          )

          attempts = 0

          begin
            attempts += 1

            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true, open_timeout: 15, read_timeout: 30) do |http|
              http.request(request)
            end

            status = response.code.to_i
            raise TransientOpenAIError, "HTTP #{response.code}: #{response.body}" if status == 429 || status >= 500
          rescue TransientOpenAIError, EOFError, Errno::ECONNRESET, Errno::ECONNREFUSED, Net::OpenTimeout, Net::ReadTimeout, OpenSSL::SSL::SSLError, SocketError => error
            if attempts < max_attempts
              warn "OpenAI request attempt #{attempts} failed (#{error.message}); retrying..."
              sleep attempts
              retry
            end

            warn "OpenAI request skipped after #{attempts} failed attempts: #{error.message}"
            write_generated_output.call(false)
            exit 0
          end

          unless response.is_a?(Net::HTTPSuccess)
            warn "OpenAI API request failed with HTTP #{response.code}: #{response.body}"
            exit 1
          end

          data = JSON.parse(response.body)
          text = data["output_text"].to_s

          if text.strip.empty?
            text = Array(data["output"]).flat_map do |item|
              Array(item["content"]).filter_map { |content| content["text"] }
            end.join("\n")
          end

          raise "OpenAI returned an empty PR message." if text.strip.empty?

          File.write("tmp/pr-message/generated.md", text.strip)
          write_generated_output.call(true)
          RUBY

      - name: Update PR body
        if: steps.openai.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require "json"

          pr = JSON.parse(File.read("pr.json"))
          current_body = pr["body"].to_s
          generated = File.read("tmp/pr-message/generated.md").strip
          raise "OpenAI returned an empty PR message." if generated.empty?

          start_marker = "<!-- ai-pr-message:start -->"
          end_marker = "<!-- ai-pr-message:end -->"
          block = "#{start_marker}\n#{generated}\n#{end_marker}"

          updated_body =
            if current_body.include?(start_marker) && current_body.include?(end_marker)
              current_body.sub(/#{Regexp.escape(start_marker)}[\s\S]*?#{Regexp.escape(end_marker)}/, block)
            elsif current_body.strip.empty?
              block
            else
              "#{block}\n\n#{current_body}"
            end

          File.write("tmp/pr-message/body.md", updated_body)
          RUBY

          gh pr edit "$PR_NUMBER" --body-file tmp/pr-message/body.md
