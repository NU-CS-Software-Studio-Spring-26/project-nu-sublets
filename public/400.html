<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <title>Bad Request | NU Sublets</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --nu-text: #000000;
            --nu-surface: #ffffff;
            --nu-soft-surface: #f7f5fa;
            --nu-border: #d9d9d9;
            --nu-muted: #5b5b5b;
            --nu-accent: #4E2A84;
            --nu-accent-dark: #3d1f68;
            --nu-shadow-soft: 0 0 25px rgba(217, 217, 217, 0.55);
            --nu-focus: rgba(78, 42, 132, 0.26);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            background: var(--nu-surface);
            color: var(--nu-text);
            font-family: "Fustat", Arial, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .error-page {
            min-height: 100vh;
            background: var(--nu-surface);
        }

        .topbar {
            min-height: 60px;
            border-bottom: 1px solid var(--nu-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            background: var(--nu-surface);
            font-family: "Rubik", Arial, sans-serif;
        }

        .topbar-inner {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            color: var(--nu-accent);
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            margin-right: 8px;
            flex: 0 0 auto;
        }

        .brand-mark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: translateY(-3px);
        }

        .topbar-nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 28px;
            flex-wrap: wrap;
        }

        .nav-link {
            color: var(--nu-text);
            font-size: 16px;
            line-height: 1.2;
        }

        .brand:focus-visible,
        .nav-link:focus-visible,
        .error-button:focus-visible,
        .secondary-link:focus-visible {
            outline: 3px solid var(--nu-focus);
            outline-offset: 4px;
        }

        .error-content {
            width: min(100%, 1200px);
            margin: 0 auto;
            padding: 112px 48px 72px;
        }

        .error-panel {
            max-width: 760px;
            padding: 40px;
            border: 1px solid var(--nu-border);
            border-radius: 8px;
            background: linear-gradient(135deg, #ffffff 0%, var(--nu-soft-surface) 100%);
            box-shadow: var(--nu-shadow-soft);
        }

        .error-code {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            margin-bottom: 28px;
            padding: 8px 14px;
            border: 1px solid rgba(78, 42, 132, 0.22);
            border-radius: 999px;
            color: var(--nu-accent);
            background: #ffffff;
            font-family: "Rubik", Arial, sans-serif;
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
        }

        .error-title {
            max-width: 640px;
            margin: 0 0 14px;
            color: var(--nu-text);
            font-family: "Rubik", Arial, sans-serif;
            font-size: clamp(40px, 6vw, 76px);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: 0;
        }

        .error-copy {
            max-width: 560px;
            margin: 0 0 32px;
            color: var(--nu-muted);
            font-size: 20px;
            line-height: 1.5;
        }

        .error-actions {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-family: "Rubik", Arial, sans-serif;
        }

        .error-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 22px;
            border-radius: 8px;
            background: var(--nu-accent);
            color: #ffffff;
            font-weight: 600;
            line-height: 1.2;
        }

        .error-button:hover {
            background: var(--nu-accent-dark);
            color: #ffffff;
        }

        .secondary-link {
            color: var(--nu-accent);
            font-weight: 600;
            line-height: 1.2;
        }

        @media (max-width: 760px) {
            .topbar {
                padding: 14px 20px;
            }

            .topbar-inner {
                align-items: flex-start;
                flex-direction: column;
                gap: 14px;
            }

            .topbar-nav {
                justify-content: flex-start;
                gap: 14px 20px;
            }

            .error-content {
                padding: 72px 20px 48px;
            }

            .error-panel {
                padding: 28px 22px;
            }

            .error-copy {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .brand,
            .nav-link {
                font-size: 14px;
            }

            .brand-mark {
                width: 28px;
                height: 28px;
            }

            .error-title {
                font-size: 40px;
            }

            .error-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .error-button,
            .secondary-link {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <header class="topbar" aria-label="Site navigation">
            <div class="topbar-inner">
                <a class="brand" href="/" aria-label="NU Sublets home">
                    <span class="brand-mark" aria-hidden="true">
                        <img src="/NUSublets%20Logo.svg" alt="">
                    </span>
                    NU Sublets
                </a>
                <nav class="topbar-nav" aria-label="Primary navigation">
                    <a class="nav-link" href="/#recommendations">Browse</a>
                    <a class="nav-link" href="/search-results">Search</a>
                    <a class="nav-link" href="/saved">Saved</a>
                    <a class="nav-link" href="/post-sublet">Post Sublet</a>
                    <a class="nav-link" href="/login">Log In</a>
                </nav>
            </div>
        </header>

        <main class="error-content">
            <section class="error-panel" aria-labelledby="error-title">
                <span class="error-code">400</span>
                <h1 class="error-title" id="error-title">This request could not be processed.</h1>
                <p class="error-copy">Something about the request did not look right. Head back home or try browsing available sublets again.</p>
                <div class="error-actions">
                    <a class="error-button" href="/">Return to Home</a>
                    <a class="secondary-link" href="/search-results">Search Sublets</a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
