<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <title>Server Error | NU Sublets</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --nu-text: #000000;
            --nu-surface: #ffffff;
            --nu-border: #d9d9d9;
            --nu-muted: #5f5f5f;
            --nu-accent: #4E2A84;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--nu-surface);
            color: var(--nu-text);
            font-family: "Fustat", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            max-width: 600px;
            padding: 48px 32px;
            text-align: center;
        }

        .error-icon {
            margin-bottom: 24px;
        }

        .error-title {
            font-family: "Rubik", sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--nu-text);
            margin: 0 0 16px;
        }

        .error-message {
            font-size: 18px;
            color: var(--nu-muted);
            line-height: 1.5;
            margin: 0 0 32px;
        }

        .error-button {
            display: inline-block;
            padding: 12px 24px;
            background: var(--nu-accent);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: "Rubik", sans-serif;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .error-button:hover {
            background: #3d1f68;
            color: white;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
            color: var(--nu-accent);
            font-family: "Rubik", sans-serif;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
        }

        .logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <a href="/" class="logo">
            <img src="/NUSublets%20Logo.svg" alt="" aria-hidden="true">
            NU Sublets
        </a>
        
        <div class="error-icon">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#dc2626" stroke-width="2"/>
                <path d="M12 6v6l4 2" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 16h.01" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        
        <h1 class="error-title">Server Error</h1>
        <p class="error-message">We're experiencing technical difficulties. Our team has been notified and is working to resolve the issue.</p>
        <a href="/" class="error-button">Return to Home</a>
    </div>
</body>
</html>
